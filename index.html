<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<title>Озвучка ЛР 5–6</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232457d6'/%3E%3Cpath d='M12 9v14l11-7z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9;--card:#ffffff;--ink:#14181f;--muted:#5f6876;--line:#e3e6eb;
  --accent:#2457d6;--accent-ink:#ffffff;--soft:#e8eefc;--hl:#fff2c2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418;--card:#1a1e24;--ink:#eef1f5;--muted:#9aa3b0;--line:#2a3039;
    --accent:#6f9bff;--accent-ink:#0d1117;--soft:#1f2a40;--hl:#3a3420;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:400 16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:15px;font-weight:600;color:var(--muted);margin:4px 2px 12px;letter-spacing:.2px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:4px;padding:4px;background:var(--line);border-radius:14px}
.tabs button{min-height:44px;border-radius:10px;font-weight:600;color:var(--muted);font-size:14px;padding:6px 4px;line-height:1.2}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.title{font-size:20px;font-weight:700;margin:0}
.chap{margin:4px 0 0;color:var(--muted);font-size:15px;min-height:1.5em}

.seek{margin:18px 0 4px}
input[type=range]{width:100%;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:var(--accent);border:3px solid var(--card)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--card)}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.ctl{display:flex;align-items:center;justify-content:center;gap:22px;margin:14px 0 6px}
.skip{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink);background:var(--soft)}
.skip svg{width:24px;height:24px;margin-bottom:-2px}
.skip span{display:block;font-size:11px;line-height:1;margin-top:-1px}
.play{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.play svg{width:34px;height:34px}
.play .i-pause{display:none}
.playing .play .i-play{display:none}.playing .play .i-pause{display:block}

.speed{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px}
.speed button{min-height:44px;padding:0;border-radius:10px;background:var(--soft);font-weight:600;font-size:14px;letter-spacing:-.2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.speed button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lbl{font-size:13px;color:var(--muted);margin:16px 2px 0}

.list{margin:14px 0 0;padding:0;list-style:none}
.list button{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left;
  min-height:52px;padding:10px 12px;border-radius:12px}
.list button:active{background:var(--soft)}
.list .n{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.list .t{font-weight:500;line-height:1.3}
.list .at{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.list button[aria-current="true"]{background:var(--soft)}
.list button[aria-current="true"] .n,.list button[aria-current="true"] .t{color:var(--accent)}

details{margin-top:12px}
summary{cursor:pointer;font-weight:600;color:var(--accent);min-height:44px;display:flex;align-items:center}
.txt{margin:4px 0 0;color:var(--ink);font-size:16px;line-height:1.6}
.foot{margin:18px 2px 0;font-size:12px;color:var(--muted)}
@media (min-width:600px){body{padding-top:32px}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px">
    <h1 style="margin:0">Озвучка к защите · голос Umi</h1>
    <a href="video.html" style="display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;background:var(--soft);color:var(--accent);font-weight:600;font-size:14px;text-decoration:none">🎬 Видео ЛР 6</a>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>

  <section class="card" aria-live="off">
    <p class="title" id="title"></p>
    <p class="chap" id="chap"></p>

    <div class="seek">
      <input type="range" id="bar" min="0" max="1000" value="0" step="1" aria-label="Позиция">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>

    <div class="ctl">
      <button class="skip" id="back" aria-label="Назад на 15 секунд">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span>15</span>
      </button>
      <button class="play" id="play" aria-label="Играть">
        <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1.2"/><rect x="14" y="4.5" width="4.5" height="15" rx="1.2"/></svg>
      </button>
      <button class="skip" id="fwd" aria-label="Вперёд на 15 секунд">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span>15</span>
      </button>
    </div>

    <p class="lbl">Скорость</p>
    <div class="speed" id="speed" role="group" aria-label="Скорость"></div>
  </section>

  <section class="card">
    <p class="lbl" style="margin-top:0">Главы</p>
    <ol class="list" id="list"></ol>
    <details id="det"><summary>Текст текущей главы</summary><p class="txt" id="txt"></p></details>
  </section>

  <p class="foot">Место и скорость запоминаются на этом устройстве. На телефоне паузу можно ставить и с экрана блокировки.</p>
</div>

<audio id="au" preload="metadata"></audio>
<script src="data.js"></script>
<script>
(function () {
  var T = window.TRACKS, au = document.getElementById('au'), app = document.getElementById('app');
  var $ = function (id) { return document.getElementById(id); };
  var SPEEDS = [0.6, 0.75, 1, 1.25, 1.5, 1.75, 2];
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var rate = store.get('rate', 1), cur = 0, chapIdx = -1, dragging = false, lastSave = 0;

  function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function fmtRate(r) { return String(r).replace('.', ',') + '×'; }

  // tabs
  T.forEach(function (tr, i) {
    var b = document.createElement('button');
    b.setAttribute('role', 'tab'); b.textContent = tr.tab || tr.id;
    b.addEventListener('click', function () { load(i, true); });
    $('tabs').appendChild(b);
  });
  // speeds
  SPEEDS.forEach(function (r) {
    var b = document.createElement('button');
    b.textContent = fmtRate(r); b.dataset.r = r;
    b.addEventListener('click', function () { setRate(r); });
    $('speed').appendChild(b);
  });

  function setRate(r) {
    rate = r; au.playbackRate = r; au.defaultPlaybackRate = r; store.set('rate', r);
    [].forEach.call($('speed').children, function (b) { b.setAttribute('aria-pressed', String(+b.dataset.r === r)); });
    if ('mediaSession' in navigator && navigator.mediaSession.setPositionState && au.duration) {
      try { navigator.mediaSession.setPositionState({ duration: au.duration, playbackRate: r, position: au.currentTime }); } catch (e) {}
    }
  }

  function load(i, autoplay) {
    if (i === cur && au.src && !autoplay) return;
    var wasPlaying = !au.paused;
    savePos();
    cur = i; chapIdx = -1; store.set('track', i);
    var tr = T[i];
    [].forEach.call($('tabs').children, function (b, k) { b.setAttribute('aria-selected', String(k === i)); });
    $('title').textContent = tr.title;
    $('list').innerHTML = '';
    tr.chapters.forEach(function (c, k) {
      var li = document.createElement('li'), b = document.createElement('button');
      b.innerHTML = '<span class="n">' + (k + 1) + '</span><span class="t"></span><span class="at">' + fmt(c.t) + '</span>';
      b.querySelector('.t').textContent = c.title;
      b.addEventListener('click', function () { seek(c.t + 0.01); au.play(); });
      li.appendChild(b); $('list').appendChild(li);
    });
    au.src = tr.src;
    var pos = store.get('pos_' + tr.id, 0);
    au.addEventListener('loadedmetadata', function once() {
      au.removeEventListener('loadedmetadata', once);
      au.playbackRate = rate;
      if (pos > 1 && pos < au.duration - 2) au.currentTime = pos;
      $('dur').textContent = fmt(au.duration); render();
      if (autoplay && wasPlaying) au.play();
    });
    meta();
  }

  function seek(t) { if (!au.duration) return; au.currentTime = Math.max(0, Math.min(au.duration - 0.2, t)); render(); }
  function savePos() { if (au.src && au.duration) store.set('pos_' + T[cur].id, au.currentTime); }

  function render() {
    var t = au.currentTime, d = au.duration || 0, p = d ? t / d : 0;
    if (!dragging) { $('bar').value = Math.round(p * 1000); $('cur').textContent = fmt(t); }
    $('bar').style.setProperty('--p', (p * 100) + '%');
    var ch = T[cur].chapters, k = 0;
    for (var i = 0; i < ch.length; i++) if (t >= ch[i].t - 0.05) k = i;
    if (k !== chapIdx) {
      chapIdx = k;
      $('chap').textContent = (k + 1) + '. ' + ch[k].title;
      $('txt').textContent = ch[k].text;
      [].forEach.call($('list').querySelectorAll('button'), function (b, j) { b.setAttribute('aria-current', String(j === k)); });
      meta();
    }
    var now = Date.now(); if (now - lastSave > 3000) { lastSave = now; savePos(); }
  }

  function meta() {
    if (!('mediaSession' in navigator)) return;
    var tr = T[cur], c = tr.chapters[Math.max(0, chapIdx)];
    try { navigator.mediaSession.metadata = new MediaMetadata({ title: c ? c.title : tr.title, artist: tr.title, album: 'Озвучка к защите' }); } catch (e) {}
  }

  function chapJump(dir) {
    var ch = T[cur].chapters, t = au.currentTime, k = chapIdx;
    if (dir < 0 && t - ch[k].t > 3) return seek(ch[k].t);
    k = Math.max(0, Math.min(ch.length - 1, k + dir)); seek(ch[k].t + 0.01);
  }

  $('play').addEventListener('click', function () { if (au.paused) au.play(); else au.pause(); });
  $('back').addEventListener('click', function () { seek(au.currentTime - 15); });
  $('fwd').addEventListener('click', function () { seek(au.currentTime + 15); });
  $('bar').addEventListener('input', function () { dragging = true; var d = au.duration || 0; $('cur').textContent = fmt(this.value / 1000 * d); this.style.setProperty('--p', (this.value / 10) + '%'); });
  $('bar').addEventListener('change', function () { dragging = false; seek(this.value / 1000 * (au.duration || 0)); });

  au.addEventListener('play', function () { app.classList.add('playing'); $('play').setAttribute('aria-label', 'Пауза'); au.playbackRate = rate; });
  au.addEventListener('pause', function () { app.classList.remove('playing'); $('play').setAttribute('aria-label', 'Играть'); savePos(); });
  au.addEventListener('timeupdate', render);
  au.addEventListener('ended', function () { store.set('pos_' + T[cur].id, 0); });
  document.addEventListener('visibilitychange', savePos);
  window.addEventListener('pagehide', savePos);

  if ('mediaSession' in navigator) {
    var ms = navigator.mediaSession, h = function (a, f) { try { ms.setActionHandler(a, f); } catch (e) {} };
    h('play', function () { au.play(); });
    h('pause', function () { au.pause(); });
    h('seekbackward', function (e) { seek(au.currentTime - (e.seekOffset || 15)); });
    h('seekforward', function (e) { seek(au.currentTime + (e.seekOffset || 15)); });
    h('seekto', function (e) { seek(e.seekTime); });
    h('previoustrack', function () { chapJump(-1); });
    h('nexttrack', function () { chapJump(1); });
  }

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'ArrowLeft') seek(au.currentTime - 5);
    else if (e.key === 'ArrowRight') seek(au.currentTime + 5);
  });

  setRate(rate);
  load(Math.min(T.length - 1, store.get('track', 0)), false);
})();
</script>
</body>
</html>
